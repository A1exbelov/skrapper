[project]
name = "skrapper"
version = "0.1.0"
description = "Telegram bot that monitors apartment listings and sends matching new ads."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.13,<4",
    "apscheduler>=3.10,<4",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pyyaml>=6.0,<7",
    "selectolax>=0.3,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
